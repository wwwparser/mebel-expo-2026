{% extends 'base.html' %}{% block body %}<h1>{{ labels.people }}</h1><section class="filter-scope" data-limit="24"><div class="filters"><input type="search" aria-label="Поиск спикера" placeholder="Имя, компания или должность…"></div><p class="result-count muted small" aria-live="polite"></p><div class="cat">{% for p in people %}<article class="pcard filter-item" data-search="{{ (p.name+' '+p.role+' '+p.about)|lower }}"><a class="pc-img person-image" href="{{ p.page }}">{% if p.image_view %}<img loading="lazy" src="{{ p.image_view }}" alt="{{ p.name }}">{% else %}<span class="ph">{{ p.name[:1] }}</span>{% endif %}</a><div class="pc-body"><h3><a href="{{ p.page }}">{{ p.name }}</a></h3><p class="pc-about">{{ p.role }}</p><a class="chip" href="{{ p.page }}">Профиль и выступления →</a></div></article>{% endfor %}</div><p class="empty" hidden>Спикеры не найдены.</p><button class="btn more">Показать ещё</button></section>{% endblock %}
