{% extends 'base.html' %}{% block body %}<header class="market-head"><p class="kicker">{{ config.brand_name }}</p><h1>{{ labels.articles }}</h1></header><section class="market-library">{% for a in items %}<article class="card"><h2><a href="{{ a.page }}">{{ a.title }}</a></h2>{% if a.get('summary') %}<p>{{ a.summary }}</p>{% endif %}{% if a.get('author') %}<p class="small muted">{{ a.author }}</p>{% endif %}<a href="{{ a.page }}">Читать материал →</a></article>{% endfor %}</section>{% endblock %}
